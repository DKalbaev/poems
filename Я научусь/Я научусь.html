<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Я научусь</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #d2f8d2, #fff5cc);
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }
        .envelope-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100vh;
        }
        .click-text {
            margin-top: 10px;
            color: #3c3c3c;
            font-size: 1.2em;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }
        .envelope {
            width: 180px;
            height: 120px;
            background: #ffcccc;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .envelope:hover { transform: scale(1.05); }
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: #ff9999;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top;
            transition: transform 2.5s ease;
        }
        .heart {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
        }
        .open .flap { transform: rotateX(180deg); }
        .content {
            display: none;
            width: 100%;
            max-width: 700px;
            text-align: center;
            padding: 30px 20px 60px;
            box-sizing: border-box;
        }
        .content.show { display: block; }
        .poem {
            font-size: 1.2em;
            color: #2d3748;
            white-space: pre-line;
            margin-bottom: 30px;
        }
        @keyframes fadeInLine {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .photo {
            width: 90%;
            max-width: 450px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 2s ease;
        }
        .photo.show { opacity: 1; }
        @media (max-width: 600px) {
            .envelope { width: 140px; height: 95px; }
            .heart { font-size: 26px; }
            .poem { font-size: 1em; }
        }
    </style>
</head>
<body>

        <div class="envelope" id="envelope">
            <div class="flap"></div>
            <div class="heart">❤️</div>
        </div>
        <div class="click-text" id="clickText">Кликни</div>
    </div>

to" id="photo">

    <script>
        const envelope = document.getElementById('envelope');
        const poemEl = document.getElementById('poem');
        const photoEl = document.getElementById('photo');
        const clickText = document.getElementById('clickText');
        const content = document.getElementById('content');

        const poemLines = [
            "Я научусь быть сильным — не закрытым,",
            "А тем, кто даёт спокойствие рядом.",
            "Научусь любить без лишних слов,",
            "А просто — делом, взглядом, правдой.",
            "",
            "Научусь молчать, когда вокруг шум,",
            "И говорить, когда нужно тепло.",
            "Не терять себя ради других,",
            "А быть тем, с кем легко и светло.",
            "",
            "Пусть время идёт, как идёт,",
            "И путь мой не будет простым.",
            "",
            "Но в доме, где живёт добро,",
            "Она однажды станет моим светом."
        ];

        envelope.addEventListener('click', () => {
            envelope.classList.add('open');
            clickText.style.display = 'none';
            setTimeout(() => {
                document.querySelector('.envelope-container').style.display = 'none';
                content.classList.add('show');
                displayPoem();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 2500);
        });

        function displayPoem() {
            let delay = 0;
            poemEl.innerHTML = '';
            poemLines.forEach(line => {
                const lineEl = document.createElement('div');
                lineEl.textContent = line;
                lineEl.style.opacity = 0;
                poemEl.appendChild(lineEl);
                setTimeout(() => {
                    lineEl.style.animation = "fadeInLine 1s forwards";
                }, delay);
                delay += 2000;
            });
            setTimeout(() => {
                photoEl.classList.add('show');
            }, delay + 500);
        }
    </script>
