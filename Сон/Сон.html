<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>СОН</title>

  <style>
    :root{
      --ink: #0f2218;
      --card: rgba(246, 255, 248, .74);
      --stroke: rgba(255,255,255,.55);
      --shadow: 0 22px 70px rgba(5, 20, 12, .22);
      --accent: rgba(255, 244, 210, .95);
    }

    *{ box-sizing: border-box; }

    body{
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      overflow-x: hidden;

      background:
        radial-gradient(900px 650px at 20% 18%, rgba(216, 255, 225, .90), transparent 60%),
        radial-gradient(780px 560px at 85% 30%, rgba(170, 235, 190, .55), transparent 62%),
        radial-gradient(900px 720px at 55% 92%, rgba(255, 236, 190, .35), transparent 60%),
        linear-gradient(135deg, #c6f2d2 0%, #89d9a6 35%, #2f8b67 75%, #1b5a45 100%);
      background-attachment: fixed;
      position: relative;
    }

    /* зерно */
    body::before{
      content:"";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      mix-blend-mode: soft-light;
      background-image:
        repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px),
        repeating-linear-gradient(90deg, rgba(0,0,0,.03) 0 1px, transparent 1px 4px);
      filter: blur(.25px);
    }

    /* световые пятна */
    body::after{
      content:"";
      position: fixed;
      inset: -40%;
      pointer-events: none;
      background:
        radial-gradient(circle at 30% 25%, rgba(255,255,255,.30) 0 18%, transparent 42%),
        radial-gradient(circle at 78% 45%, rgba(255,255,255,.18) 0 14%, transparent 40%),
        radial-gradient(circle at 52% 80%, rgba(255,255,255,.12) 0 12%, transparent 36%),
        radial-gradient(circle at 60% 35%, var(--accent) 0 10%, transparent 35%);
      filter: blur(18px);
      opacity: .55;
      transform: rotate(-7deg);
    }

    .wrap{
      width: min(900px, 92vw);
      padding: clamp(18px, 3vw, 30px);
    }

    .card{
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 26px;
      padding: clamp(22px, 3.5vw, 40px);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    /* ====== ОБЛОЖКА (СОН + 📖) ПО СЕРЕДИНЕ ====== */
    .cover{
      display: grid;
      place-items: center;
      text-align: center;
      gap: 14px;
      padding: clamp(26px, 6vw, 54px) 10px;
      transition: opacity .55s ease, transform .55s ease;
    }

    .coverTitle{
      margin: 0;
      font-weight: 900;
      letter-spacing: .22em;
      font-size: clamp(28px, 4vw, 42px);
      text-transform: uppercase;
      opacity: .92;
    }

    .bookBtn{
      appearance: none;
      border: 1px solid rgba(15,34,24,.16);
      background: rgba(255,255,255,.62);
      border-radius: 22px;
      padding: 14px 18px;
      cursor: pointer;
      box-shadow: 0 14px 30px rgba(0,0,0,.12);
      display: inline-grid;
      place-items: center;
      gap: 6px;
      user-select: none;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
      min-width: 86px;
    }

    .bookBtn:hover{ background: rgba(255,255,255,.72); }
    .bookBtn:active{
      transform: translateY(1px) scale(.99);
      box-shadow: 0 8px 18px rgba(0,0,0,.11);
    }

    .bookIcon{ font-size: 34px; line-height: 1; }
    .bookHint{ font-size: 12px; opacity: .72; }

    /* исчезновение обложки */
    .cover.hide{
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
      height: 0;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }

    /* ====== СТИХ: появляется после нажатия ====== */
    .poem{
      margin: 0;
      line-height: 1.75;
      font-size: clamp(18px, 2.6vw, 24px);
      font-weight: 650;
      text-wrap: pretty;
      display: none;           /* скрыт до клика */
    }

    .poem.showPoem{ display: block; }

    .line{
      display: block;
      opacity: 0;
      transform: translateY(14px);
      filter: blur(2px);
      transition:
        opacity .85s ease,
        transform .85s cubic-bezier(.2,.8,.2,1),
        filter .85s ease;
      will-change: opacity, transform, filter;
    }

    .line.show{
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }

    .gap{ margin-top: 14px; }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card">

      <!-- ОБЛОЖКА -->
      <div class="cover" id="cover">
        <h1 class="coverTitle">СОН</h1>
        <button class="bookBtn" id="openBtn" type="button" aria-label="Открыть стих">
          <div class="bookIcon">📖</div>
          <div class="bookHint">нажми</div>
        </button>
      </div>

      <!-- СТИХ -->
      <p class="poem" id="poem" aria-live="polite">
        <span class="line">Я говорил себе: прошло,</span>
        <span class="line">Сотрётся имя, стихнет боль.</span>
        <span class="line">Но ты во сне вошла легко —</span>
        <span class="line">И снова стала мной.</span>

        <span class="line gap">Мы были в том далёком саду,</span>
        <span class="line">Где так и не смогли быть вдвоём.</span>
        <span class="line">Там ветер хранил нашу мечту,</span>

        <span class="line gap">Там каждый миг был о живом.</span>
        <span class="line">Я не держу. Я не зову.</span>
        <span class="line">Но в тишине ловлю одно:</span>
        <span class="line">Не отпустил.</span>
        <span class="line">И не дано.</span>
      </p>

    </section>
  </main>

  <script>
    const cover = document.getElementById('cover');
    const btn = document.getElementById('openBtn');
    const poem = document.getElementById('poem');
    const lines = Array.from(document.querySelectorAll('.line'));

    function resetLines(){
      lines.forEach(l => l.classList.remove('show'));
    }

    function reveal(){
      resetLines();
      poem.classList.add('showPoem');
      lines.forEach((line, i) => {
        setTimeout(() => line.classList.add('show'), 1600 * i); // скорость строк
      });
    }

    // старт: стих скрыт
    resetLines();

    btn.addEventListener('click', () => {
      // прячем эмодзи/обложку, показываем стих
      cover.classList.add('hide');
      reveal();
    });
  </script>
</body>
</html>
